name: Deploy to OVH

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ secrets.OVH_SFTP_HOST }}
          username: ${{ secrets.OVH_SFTP_USERNAME }}
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          port: 22
          uploads: |
            ./dist/ => ./${{ secrets.OVH_REMOTE_PATH }}/
