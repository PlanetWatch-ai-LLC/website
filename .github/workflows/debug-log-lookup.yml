name: Debug Log Lookup
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: List server dirs and fetch error_log if present
        run: |
          USERPASS="${{ secrets.OVH_SFTP_USERNAME }}:${{ secrets.OVH_SFTP_PASSWORD }}"
          HOST="${{ secrets.OVH_SFTP_HOST }}"
          SUBDIR=$(curl -sS --user "$USERPASS" "ftp://$HOST:21/home/" | awk '{print $NF}' | grep -vE '^\.\.?$')
          echo "--- home/<subdir> listing ---"
          curl -sS --user "$USERPASS" "ftp://$HOST:21/home/$SUBDIR/"
          echo "--- searching for log files recursively (depth-limited) ---"
          for d in "" "logs/" "log/"; do
            curl -sS --user "$USERPASS" "ftp://$HOST:21/home/$SUBDIR/$d" 2>/dev/null
          done
          echo "--- www/error_log tail (if exists) ---"
          curl -sS --user "$USERPASS" "ftp://$HOST:21/www/error_log" 2>/dev/null | tail -20 || true
