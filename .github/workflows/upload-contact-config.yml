name: Upload contact-config.php (one-off)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload contact-config.php
        run: |
          cat > contact-config.php <<EOF
          <?php
          define('CONTACT_SMTP_HOST', 'ssl0.ovh.net');
          define('CONTACT_SMTP_PORT', 587);
          define('CONTACT_SMTP_USER', 'noreply@planetwatch.ai');
          define('CONTACT_SMTP_PASS', '${{ secrets.CONTACT_SMTP_PASSWORD }}');
          define('CONTACT_FROM_EMAIL', 'noreply@planetwatch.ai');
          define('CONTACT_TO_EMAIL', 'contact@planetwatch.ai');
          EOF
          curl -sS -T contact-config.php --user "${{ secrets.OVH_SFTP_USERNAME }}:${{ secrets.OVH_SFTP_PASSWORD }}" "ftp://${{ secrets.OVH_SFTP_HOST }}:21/www/contact-config.php"
          rm -f contact-config.php
          echo "Uploaded."
