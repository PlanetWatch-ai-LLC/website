name: Debug SFTP Layout

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect remote FTP layout (port 21)
        run: |
          echo "--- plain ftp www listing ---"
          curl -sS --user "${{ secrets.OVH_SFTP_USERNAME }}:${{ secrets.OVH_SFTP_PASSWORD }}" "ftp://${{ secrets.OVH_SFTP_HOST }}:21/www/"
          echo "--- ftps (explicit TLS) www listing ---"
          curl -sS --ssl-reqd -k --user "${{ secrets.OVH_SFTP_USERNAME }}:${{ secrets.OVH_SFTP_PASSWORD }}" "ftp://${{ secrets.OVH_SFTP_HOST }}:21/www/"
